<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link type="text/css" rel="stylesheet" href="style.css" />
    <title>WBOIT Transparency</title>
  </head>
  <body>
    <div>
      <div class="info">WBOIT Transparency</div>
      <table class="leftInfo">
        <tr>
          <td>Sphere: Custom Normal Material</td>
        </tr>
        <tr>
          <td>Others: Builtin Three.js Materials</td>
        </tr>
      </table>
    </div>
    <div>
      <table class="rightInfo">
        <tr>
          <td>
            <label id="opacityLabel">Opacity</label>
          </td>
          <td>
            <div>
              <input
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                class="slider"
                id="opacityRange"
              />
            </div>
          </td>
        </tr>
        <tr>
          <td>&nbsp;</td>
        </tr>
        <tr>
          <td>
            <label id="wboitLabel">Use WBOIT Material</label>
          </td>
          <td>
            <input type="checkbox" id="wboitCheckbox" />
          </td>
        </tr>
      </table>
    </div>
    <script type="module" src="wboit.js"></script>
  </body>
</html>
